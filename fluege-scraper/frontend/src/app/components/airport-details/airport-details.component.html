<header class="airport-heading">
    <span class="airport-code">{{ airport().iata_code ?? '-' }}</span>
    <div>
        <h2>{{ airport().detail_airport_name ?? airport().airport_name }}</h2>
        <p>{{ airport().location ?? 'Keine Ortsangabe vorhanden' }}</p>
    </div>
</header>

<p-table [value]="detailRows()" size="small" stripedRows>
    <ng-template #header>
        <tr>
            <th>Merkmal</th>
            <th>Wert</th>
        </tr>
    </ng-template>
    <ng-template #body let-detail>
        <tr>
            <td>{{ detail.label }}</td>
            <td>{{ detail.value }}</td>
        </tr>
    </ng-template>
</p-table>

<a
    pButton
    class="wikipedia-link"
    [href]="airport().airport_url"
    target="_blank"
    rel="noopener noreferrer"
>
    <span pButtonLabel>Wikipedia-Artikel öffnen</span>
    <i class="pi pi-external-link" aria-hidden="true"></i>
</a>
