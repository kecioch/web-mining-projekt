<section class="dashboard" [class.dashboard--dark]="mapTheme() === 'dark'">
    <header class="map-toolbar">
        <h1>
            Verkehrsflughäfen <span>{{ airportCount() }}</span>
        </h1>

        <p-button
            [rounded]="true"
            [text]="true"
            [icon]="mapTheme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'"
            [ariaLabel]="
                mapTheme() === 'light' ? 'Dunkle Karte aktivieren' : 'Helle Karte aktivieren'
            "
            [title]="mapTheme() === 'light' ? 'Dunkle Karte' : 'Helle Karte'"
            (onClick)="toggleMapTheme()"
        />
    </header>

    <main class="map-area">
        @if (loadingAirports()) {
            <p class="map-message">Flughafendaten werden geladen...</p>
        }
        @if (loadError(); as error) {
            <p class="map-message map-message--error">{{ error }}</p>
        }

        <div
            class="map-container"
            leaflet
            [leafletOptions]="mapOptions"
            (leafletMapReady)="onMapReady($event)"
        ></div>
    </main>

    <p-drawer
        [visible]="drawerVisible()"
        (visibleChange)="setDrawerVisibility($event)"
        [modal]="false"
        [dismissible]="false"
        [style]="{ width: '32rem', maxWidth: '90vw' }"
        position="right"
        styleClass="airport-drawer"
    >
        @if (selectedAirport(); as airport) {
            <app-airport-details
                [airport]="airport"
                [connections]="connections()"
                [loadingConnections]="loadingConnections()"
                [connectionsError]="connectionsError()"
                [airlines]="airlines()"
                [loadingAirlines]="loadingAirlines()"
                [airlinesError]="airlinesError()"
                [aircraft]="aircraft()"
                [loadingAircraft]="loadingAircraft()"
                [aircraftError]="aircraftError()"
                [delayAnalysis]="delayAnalysis()"
                [loadingDelayAnalysis]="loadingDelayAnalysis()"
                [delayAnalysisError]="delayAnalysisError()"
                [range]="range()"
                (rangeChange)="onRangeChange($event)"
            />
        }
    </p-drawer>
</section>
