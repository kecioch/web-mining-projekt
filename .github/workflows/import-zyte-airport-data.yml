name: Import Zyte data and refresh airport analysis

on:
  schedule:
    # Zyte startet die Airport-Spider täglich um 10:00 UTC.
    # Der Import beginnt danach um 10:30 UTC; die Analyse wartet auf den Import.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Flugtag (YYYY-MM-DD) ansonsten leer lassen bedeutet gestern"
        required: false
        type: string
      delay_threshold:
        description: "Grenzwert: verspätet bei mehr als X Minuten"
        required: true
        default: "15"
        type: string
      dry_run:
        description: "Import und Analyse nur prüfen, nichts speichern"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-airport-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install requests beautifulsoup4

      - name: Import completed Scrapy Cloud jobs into Supabase
        env:
          SCRAPY_CLOUD_API_KEY: ${{ secrets.SCRAPY_CLOUD_API_KEY }}
          SCRAPY_CLOUD_PROJECT_ID: "870950"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Ohne diese explizite Repository-Freigabe bleibt auch der Zeitplan
          # sicher im Nur-Lesen-Modus.
          DRY_RUN: ${{ vars.ZYTE_DB_IMPORT_ENABLED != 'true' || inputs.dry_run }}
        run: python fluege-scraper/scripts/import_zyte_to_supabase.py

  analyze:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependency
        run: python -m pip install requests

      - name: Calculate daily airport analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANALYSIS_DATE: ${{ inputs.analysis_date }}
          DELAY_THRESHOLD: ${{ inputs.delay_threshold || '15' }}
          # Die Analyse schreibt nur, wenn Import und Analyse freigeschaltet sind.
          DRY_RUN: ${{ vars.ZYTE_DB_IMPORT_ENABLED != 'true' || vars.AIRPORT_ANALYSIS_ENABLED != 'true' || inputs.dry_run }}
        run: python fluege-scraper/scripts/refresh_airport_analysis.py
