name: Refresh daily airport analysis

on:
  schedule:
    # Um 02:30 UTC ist der vorherige deutsche Flugtag vollständig beendet.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Flugtag (YYYY-MM-DD); leer bedeutet gestern"
        required: false
        type: string
      delay_threshold:
        description: "Grenzwert: verspätet bei mehr als X Minuten"
        required: true
        default: "15"
        type: string
      dry_run:
        description: "Nur Datum und Grenzwert anzeigen, nichts speichern"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: refresh-airport-analysis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Calculate daily airport analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANALYSIS_DATE: ${{ inputs.analysis_date }}
          DELAY_THRESHOLD: ${{ inputs.delay_threshold || '15' }}
          # Der Zeitplan schreibt erst, nachdem die Repository-Variable aktiviert wurde.
          DRY_RUN: ${{ vars.AIRPORT_ANALYSIS_ENABLED != 'true' || inputs.dry_run }}
        run: python fluege-scraper/scripts/refresh_airport_analysis.py
