name: Scrape flight-data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min, at :00 and :30 UTC
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r crawler/Soup/requirements.txt

      - run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/Soup/scripts/soup_flightdata_arr_dep.py