name: Enrich airport master data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, was ergänzt würde"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: enrich-airport-master-data
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fill missing airport data from OurAirports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python fluege-scraper/scripts/enrich_airports.py
